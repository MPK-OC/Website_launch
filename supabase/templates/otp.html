<!-- Ova Cure sign-in email. Paste into Supabase → Authentication → Emails → Templates
     for BOTH "Confirm signup" (new users) and "Magic Link" (returning users). -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #24182f;">
  <h2 style="color: #6b3fa3; margin: 0 0 8px;">Ova Cure</h2>
  <p style="margin: 0 0 16px;">Your sign-in code is:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; background: #f8f3fe; color: #4f2d7a; padding: 16px; text-align: center; border-radius: 12px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0 0 16px;">Enter it on the sign-in screen. It expires in 1 hour. Requesting a new code cancels this one.</p>
  <p style="font-size: 13px; color: #64748b; margin: 0;">Or <a href="{{ .ConfirmationURL }}" style="color: #8350c4;">tap here to sign in</a> (open it in the same browser where you asked for the code).</p>
  <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">If you didn't ask for this, you can ignore this email.</p>
</div>
